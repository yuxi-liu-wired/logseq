# Builds fork/main on top of the current upstream master and publishes it as
# the release tagged `fork-nightly` on this fork.
#
# Every day: rebase fork/main onto logseq/logseq master in the runner's own
# checkout (stop on a conflict), lint and run the unit suite, build the desktop
# app the way upstream's release workflow does, and replace the `fork-nightly`
# release with the new AppImage and zip.
#
# The rebase result stays inside each job. GITHUB_TOKEN refuses a push that
# changes any file under .github/workflows, which a rebase does whenever
# upstream edits one of its own workflows, so the branch is advanced by hand
# and the runner only builds.
name: Fork nightly

on:
  push:
    branches:
      - fork/main
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CLOJURE_VERSION: '1.12.4.1618'
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  OCAML_VERSION: '5.1.1'
  BABASHKA_VERSION: '1.12.215'
  PNPM_VERSION: '10.33.0'

jobs:
  rebase:
    runs-on: ubuntu-22.04
    outputs:
      upstream: ${{ steps.rebase.outputs.upstream }}
    steps:
      - name: Check out fork/main
        uses: actions/checkout@v4
        with:
          ref: fork/main
          fetch-depth: 0

      - name: Rebase onto upstream master
        id: rebase
        run: |
          git config user.name "Yuxi Liu"
          git config user.email "yuxi@yuxi.ml"
          git remote add upstream https://github.com/logseq/logseq.git
          git fetch upstream master
          echo "upstream=$(git rev-parse upstream/master)" >> "$GITHUB_OUTPUT"
          if git rebase upstream/master; then
            echo "rebased fork/main onto $(git rev-parse --short upstream/master)"
          else
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open an issue on a rebase conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "fork/main: rebase onto upstream ${{ steps.rebase.outputs.upstream }} has conflicts" \
            --body "The scheduled rebase of fork/main onto logseq/logseq master ${{ steps.rebase.outputs.upstream }} stopped on a conflict. Resolve it by hand: fetch upstream, rebase fork/main, keep the mechanism described in FORK.md, push with --force-with-lease. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  test:
    needs: rebase
    runs-on: ubuntu-22.04
    steps:
      - name: Check out fork/main
        uses: actions/checkout@v4
        with:
          ref: fork/main
          fetch-depth: 0

      - name: Rebase onto the same upstream commit
        run: |
          git config user.name "Yuxi Liu"
          git config user.email "yuxi@yuxi.ml"
          git remote add upstream https://github.com/logseq/logseq.git
          git fetch upstream master
          git rebase ${{ needs.rebase.outputs.upstream }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Clojure cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Fetch Clojure deps
        run: clojure -A:cljs -P

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: clojure -M:clj-kondo --parallel --lint src

      - name: Build test asset
        # Upstream's own build.yml compiles the db-worker-node target here as
        # well; the graph lifecycle tests start a real worker from it.
        run: pnpm cljs:test

      - name: Run ClojureScript tests
        run: pnpm cljs:run-test

  build:
    needs: [rebase, test]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out fork/main
        uses: actions/checkout@v4
        with:
          ref: fork/main
          fetch-depth: 0

      - name: Rebase onto the same upstream commit
        id: rebased
        run: |
          git config user.name "Yuxi Liu"
          git config user.email "yuxi@yuxi.ml"
          git remote add upstream https://github.com/logseq/logseq.git
          git fetch upstream master
          git rebase ${{ needs.rebase.outputs.upstream }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Clojure cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --with-test --yes

      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Version
        id: ref
        run: |
          pkgver=$(node ./scripts/get-pkg-version.js nightly)
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"
          sed -i 's/defonce version ".*"/defonce version "'"$pkgver"'"/g' src/main/frontend/version.cljs

      - name: Compile CLJS
        run: |
          pnpm install --frozen-lockfile
          pnpm exec gulp build
          pnpm cljs:release-electron
          pnpm db-worker-node:bundle
          opam exec -- pnpm cli:release
          pnpm webpack-app-build
          pnpm desktop:prepare-runtime-js

      - name: Stamp the version into the app package
        working-directory: ./static
        run: |
          sed -i 's/"version": "0.0.1"/"version": "${{ steps.ref.outputs.version }}"/g' ./package.json
          echo "${{ steps.ref.outputs.version }}" > ./VERSION

      - name: Package the Linux app
        # static/ is inside the pnpm workspace; without --ignore-workspace the
        # install lands at the workspace root and electron-builder is absent here.
        working-directory: ./static
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm electron:make

      - name: Collect artifacts
        run: |
          mkdir -p builds
          cp static/VERSION builds/VERSION
          mv static/dist/*.AppImage builds/
          mv static/dist/*.zip builds/Logseq-linux-x86_64-${{ steps.ref.outputs.version }}.zip
          ls -la builds

      - name: Replace the fork-nightly release
        run: |
          # -R is explicit because this checkout also has logseq/logseq as a
          # remote, and gh picks that one otherwise. --target names the commit
          # the tag points at, since the built tree stays in the runner.
          gh release delete fork-nightly -R ${{ github.repository }} --yes --cleanup-tag || true
          gh release create fork-nightly builds/* \
            -R ${{ github.repository }} \
            --target fork/main \
            --title "Fork nightly ${{ steps.ref.outputs.version }}" \
            --notes "fork/main rebased onto upstream ${{ needs.rebase.outputs.upstream }}, built as ${{ steps.rebased.outputs.sha }}. Changes listed in FORK.md."
